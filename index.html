document.write('<link rel="stylesheet" href="lich.css' + V + '">');</script>

<div id="lich"></div>
<script>
['config.js', 'data.js', 'lich.js'].reduce((p, f) => p.then(() => new Promise((ok, no) => {
  const sc = document.createElement('script'); sc.src = f + V; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc);
})), Promise.resolve()).then(() => NinemilaLich.mount(document.getElementById('lich')));
</script>
